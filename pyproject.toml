[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fplengine"
version = "0.2.0"
description = "Evidence-first Fantasy Premier League and Premier League intelligence engine"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "fplengine contributors" }]
dependencies = []

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
dev = ["pytest>=8,<9", "ruff>=0.12,<1"]

[project.scripts]
fplengine = "fplengine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fplengine = ["migrations/*.sql", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
