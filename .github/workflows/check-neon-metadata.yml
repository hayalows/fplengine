name: Check Neon metadata

on:
  push:
    paths:
      - ".github/workflows/check-neon-metadata.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install "psycopg[binary]>=3.2,<4"
      - name: Check Neon metadata
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        shell: bash
        run: |
          python - <<'PY'
          import os, psycopg
          url=os.environ.get("DATABASE_URL")
          if not url:
              raise SystemExit("NEON_DATABASE_URL is not configured")
          with psycopg.connect(url) as conn:
              with conn.cursor() as cur:
                  cur.execute("""
                    select name, setting
                    from pg_settings
                    where lower(name) like '%neon%'
                       or lower(name) like '%project%'
                       or lower(name) like '%branch%'
                       or lower(name) like '%endpoint%'
                    order by name
                  """)
                  for name, setting in cur.fetchall():
                      print(f"{name}={setting}")
                  cur.execute("select version()")
                  print("version="+cur.fetchone()[0])
          PY
