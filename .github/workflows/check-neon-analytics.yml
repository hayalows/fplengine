name: Check Neon analytics privileges

on:
  push:
    paths:
      - ".github/workflows/check-neon-analytics.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install "psycopg[binary]>=3.2,<4"
      - name: Check database privileges
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          import psycopg

          url = os.environ.get("DATABASE_URL")
          if not url:
              raise SystemExit("NEON_DATABASE_URL is not configured")

          with psycopg.connect(url) as conn:
              with conn.cursor() as cur:
                  cur.execute("""
                    select
                      current_database(),
                      current_user,
                      has_database_privilege(current_user, current_database(), 'CREATE'),
                      has_schema_privilege(current_user, 'public', 'CREATE'),
                      r.rolcreatedb,
                      r.rolsuper
                    from pg_roles r
                    where r.rolname = current_user
                  """)
                  db, user, db_create, public_create, createdb, superuser = cur.fetchone()
                  print(f"database={db}")
                  print(f"user={user}")
                  print(f"database_create={db_create}")
                  print(f"public_schema_create={public_create}")
                  print(f"role_createdb={createdb}")
                  print(f"role_superuser={superuser}")
          PY
