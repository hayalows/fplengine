name: Check Neon admin secret availability

on:
  push:
    paths:
      - ".github/workflows/check-neon-admin-secrets.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check secret presence
        env:
          NEON_API_KEY_VALUE: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID_VALUE: ${{ secrets.NEON_PROJECT_ID }}
          NEON_PARENT_BRANCH_ID_VALUE: ${{ secrets.NEON_PARENT_BRANCH_ID }}
          VERCEL_TOKEN_VALUE: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          [[ -n "$NEON_API_KEY_VALUE" ]] && echo "neon_api_key=present" || echo "neon_api_key=missing"
          [[ -n "$NEON_PROJECT_ID_VALUE" ]] && echo "neon_project_id=present" || echo "neon_project_id=missing"
          [[ -n "$NEON_PARENT_BRANCH_ID_VALUE" ]] && echo "neon_parent_branch_id=present" || echo "neon_parent_branch_id=missing"
          [[ -n "$VERCEL_TOKEN_VALUE" ]] && echo "vercel_token=present" || echo "vercel_token=missing"
