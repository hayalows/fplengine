name: One-time FPL production activation

on:
  push:
    branches:
      - ops/activate-production-once
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fplengine-production-ingestion
  cancel-in-progress: false

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[postgres]"
      - name: Run production ingestion once
        env:
          FPLENGINE_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        shell: bash
        run: |
          if [[ -z "$FPLENGINE_DATABASE_URL" ]]; then
            echo "NEON_DATABASE_URL is missing"
            exit 1
          fi
          python -m fplengine.production_run
          python -m fplengine evaluate-latest
