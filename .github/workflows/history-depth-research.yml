name: History depth research

on:
  push:
    branches:
      - research/history-depth-run
    paths-ignore:
      - reports/history_depth_2025_26.json
  pull_request:
    paths:
      - src/fplengine/historical.py
      - src/fplengine/historical_model.py
      - src/fplengine/history_benchmark.py
      - research/run_history_depth.py
      - .github/workflows/history-depth-research.yml

permissions:
  contents: write

concurrency:
  group: history-depth-research-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e .
      - name: Fetch public historical archive sparsely
        shell: bash
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/vaastav/Fantasy-Premier-League.git /tmp/vaastav
          cd /tmp/vaastav
          git sparse-checkout set \
            data/2016-17 data/2017-18 data/2018-19 data/2019-20 data/2020-21 \
            data/2021-22 data/2022-23 data/2023-24 data/2024-25 data/2025-26
      - name: Run held-out 2025-26 history-depth benchmark
        run: python research/run_history_depth.py --data-root /tmp/vaastav/data
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: history-depth-2025-26
          path: reports/history_depth_2025_26.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Commit research report to this branch
        if: success() && github.event_name == 'push'
        shell: bash
        run: |
          git config user.name "fplengine-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/history_depth_2025_26.json
          git diff --cached --quiet && exit 0
          git commit -m "research: record held-out history-depth results"
          git push origin HEAD:research/history-depth-run
