name: FPL ingestion and evaluation

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: fplengine-production-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[postgres]"
      - name: Ingest, predict, and evaluate
        env:
          FPLENGINE_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        shell: bash
        run: |
          if [[ -z "$FPLENGINE_DATABASE_URL" ]]; then
            echo "NEON_DATABASE_URL is not configured; safe no-op."
            exit 0
          fi
          # Production schema changes are deployed separately. The scheduled role only
          # needs DML privileges on the engine schema, never owner-level DDL rights.
          python -m fplengine.production_run
          python -m fplengine evaluate-latest
