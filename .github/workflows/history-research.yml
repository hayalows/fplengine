name: v0.3 historical research

on:
  workflow_dispatch:
  push:
    branches:
      - research/v0.3-history
    paths:
      - "src/fplengine/history.py"
      - "src/fplengine/model_v3.py"
      - "src/fplengine/history_experiment.py"
      - "src/fplengine/legacy_history_compat.py"
      - "tests/test_history.py"
      - "tests/test_model_v3.py"
      - ".github/workflows/history-research.yml"
  pull_request:
    paths:
      - "src/fplengine/history.py"
      - "src/fplengine/model_v3.py"
      - "src/fplengine/history_experiment.py"
      - "src/fplengine/legacy_history_compat.py"
      - "tests/test_history.py"
      - "tests/test_model_v3.py"
      - ".github/workflows/history-research.yml"

permissions:
  contents: read

concurrency:
  group: fplengine-v0-3-history-research-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e .
      - name: Unit tests before historical compute
        run: python -m unittest discover -v
      - name: Fetch historical FPL seasons sparsely
        shell: bash
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/vaastav/Fantasy-Premier-League.git .data/vaastav
          cd .data/vaastav
          git sparse-checkout set \
            data/2016-17 data/2017-18 data/2018-19 data/2019-20 data/2020-21 \
            data/2021-22 data/2022-23 data/2023-24 data/2024-25 data/2025-26
      - name: Normalize legacy metadata without altering source semantics
        run: python -m fplengine.legacy_history_compat .data/vaastav/data
      - name: Run field-aware walk-forward experiment
        run: |
          python -m fplengine.history_experiment .data/vaastav/data \
            --output reports/history_depth_v0_3.json
      - uses: actions/upload-artifact@v4
        with:
          name: v0-3-history-research
          path: reports/history_depth_v0_3.json
          if-no-files-found: error
          retention-days: 14
